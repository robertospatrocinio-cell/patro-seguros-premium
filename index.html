    <script>
      (function() {
        var loader = document.getElementById('initial-loader');
        var startTime = Date.now();
        var timeout = 12000;
        var checkInterval = setInterval(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            document.body.classList.add('loaded');
            clearInterval(checkInterval);
          } else if (Date.now() - startTime > timeout) {
            var text = document.querySelector('.loader-text');
            if (text) text.textContent = '';
            // Cria botão de recarregar dinamicamente (fora do HTML servido
            // aos crawlers, para não contaminar o conteúdo indexado).
            var btn = document.createElement('button');
            btn.className = 'retry-button';
            btn.style.display = 'block';
            btn.textContent = 'Recarregar';
            btn.onclick = function () { location.reload(); };
            if (loader) loader.appendChild(btn);
            clearInterval(checkInterval);
          }
        }, 100);
      })();
    </script>
