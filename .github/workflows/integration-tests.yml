name: Integration Tests (prerender + validator)

# Executa a suíte de integração `scripts/prerender-validate-integration.test.mjs`
# em modo estrito (`--strict-warn`). O teste:
#   1. Monta um dist temporário com o fixture mínimo (/, /seguro-auto, /faq).
#   2. Roda o validador real `scripts/validate-google-rich-results.mjs` com
#      `--strict-warn` — falha em qualquer `eligible-warn` ou `ineligible`.
#   3. Valida invariância de ordem, determinismo (5 execuções idênticas),
#      testes negativos em Organization e snapshot de drift do relatório.
#
# Este workflow é obrigatório em PRs para `main`: qualquer regressão em
# breakdown por rota / por @type quebra o PR antes do merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: prerender + rich-results validator (--strict-warn)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration suite (strict)
        # O teste chama o validador com `--strict-warn` internamente.
        # Cobre: fixture mínimo, invariância à ordem, determinismo,
        # testes negativos em Organization e snapshot do relatório.
        run: bun run test:integration

      - name: Upload snapshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-snapshot
          path: scripts/__snapshots__/
          if-no-files-found: ignore