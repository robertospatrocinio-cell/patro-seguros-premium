name: SEO Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_warn:
        description: "Permitir eligible-warn no validador do Google Rich Results (por padrão o CI falha em warn)"
        type: boolean
        default: false

jobs:
  jsonld:
    name: JSON-LD & breadcrumbs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Install puppeteer (Chromium) for React SSG
        # Necessário para o passo `prerender-react.mjs` rodar com ENABLE_REACT_SSG=1
        # e gerar HTML estático real das 836 rotas (Fase 1+2+3).
        run: bun add -d puppeteer

      - name: Unit tests - JSON-LD validator
        run: bun run test:jsonld

      - name: Unit tests - canonical & headings validator
        run: bun run test:canonical

      - name: Unit tests - heading hierarchy validator (source + hierarquia + jumplinks)
        run: bun run test:heading-hierarchy

      - name: Build com SSG real (prerender.mjs + prerender-react.mjs + validate-jsonld-build)
        env:
          ENABLE_REACT_SSG: "1"
        run: bun run build

      - name: Re-validar JSON-LD em dist/
        run: bun run validate:jsonld

      - name: Validar canonical & headings em dist/
        run: bun run validate:canonical

      - name: Validar canonical STRICT (presença + URL correta em todas as páginas de dist/)
        run: bun run validate:canonical-strict

      - name: Verificar se .htaccess está sincronizado com src/lib/redirects.ts
        run: node scripts/sync-htaccess-redirects.mjs --check

      - name: Validar redirects (salto único, 301/410) e higiene dos sitemaps
        run: bunx vitest run scripts/redirects-single-hop.test.ts scripts/sitemap-hygiene.test.ts

      - name: Validar unicidade de H2 (heading uniqueness) em dist/
        run: bun run validate:headings

      - name: Validar jump links + hierarquia de headings (checagem unificada) em dist/
        # Contrato único: todo jump link do site aponta para um heading
        # <h1|h2|h3> com id correto, a hierarquia não pula níveis, e a seção
        # tem aria-labelledby. Substitui as duas execuções separadas de
        # validate:jumplinks e validate:heading-hierarchy.
        run: bun run validate:jumplinks-headings

      - name: Validar rich results (FAQPage + HowTo + BreadcrumbList) em dist/
        run: bun run validate:rich-snippets

      - name: Validar elegibilidade Google Rich Results em dist/ (STRICT — falha em warn OU ineligible)
        # Contrato do CI: 0 `eligible-warn` e 0 `ineligible` em toda rota de dist/.
        # `workflow_dispatch` com allow_warn=true é a única forma de rodar em modo
        # permissivo (debug manual) — push/PR sempre em modo estrito.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_warn }}" = "true" ]; then
            bun run validate:google-rich-results -- --allow-warn
          else
            bun run validate:google-rich-results -- --strict-warn
          fi

      - name: Upload do relatório Google Rich Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-rich-results-report
          path: dist/google-rich-results-report.json
          if-no-files-found: ignore

      - name: Validar schemas críticos (FAQPage, Service, BreadcrumbList, Organization) — falha em qualquer erro
        run: bun run validate:critical-schemas

      - name: Upload do relatório de schemas críticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-schemas-report
          path: dist/critical-schemas-report.json
          if-no-files-found: ignore

      - name: Relatório de cobertura JSON-LD (CI — falha se rota estiver sem Breadcrumb/FAQ/HowTo obrigatório)
        run: bun run report:schema-coverage:ci ./reports

      - name: Upload do relatório de cobertura JSON-LD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-coverage-report
          path: |
            reports/schema-coverage-report.json
            reports/schema-coverage-report.html
          if-no-files-found: ignore